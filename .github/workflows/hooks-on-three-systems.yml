# The plugins' hooks on Windows, macOS and Linux, run by a real Claude Code.
#
# Each job installs Claude Code the way a person does, adds every plugin the catalogue lists from a local folder
# (a catalogue next to their checkouts), installs them, and then:
#   1. ci/hooks_like_claude.py runs every hook command exactly as Claude Code spawns it - on Windows
#      in PowerShell 7, Windows PowerShell 5.1 and Git Bash - with a real Python and with none;
#   2. ci/claude_e2e.py runs a real `claude -p` session against a stand-in API that asks for a Write
#      and a Bash call, and checks what the hooks did and said.
#   3. ci/skills_like_claude.py runs every script the skills name, the way the Bash tool and the
#      PowerShell tool run a skill's command (Windows: Git Bash, PowerShell 7, Windows PowerShell 5.1),
#      with a real Python and with none;
#   4. ci/claude_skill_e2e.py runs a real `claude -p` in the default permission mode that opens two
#      skills and runs the command written in each - it must run on the skill's allowed-tools, no prompt.
# On Windows steps 2 and 4 run twice: with Git Bash, and after Git is moved away, when Claude Code falls
# back to PowerShell for hooks and has only the PowerShell tool (the case a person without Git for
# Windows is in).
#
# The job `just-installed-python` is a Windows that has never had Python: it installs python.org's
# Python silently in the middle of the job, the way step 0 of START-HERE does, and then runs a hook and
# a skill's script with the PATH the job had before the install - the PATH a Claude Code started
# before step 0 still hands its hooks and shells. They must find the new Python with no restart.
name: hooks and skills on three systems

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag of the plugin repositories"
        default: main
  push:
    branches: [main]
    paths: ["ci/**", ".github/workflows/hooks-on-three-systems.yml"]

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalogue

      # Every plugin the catalogue lists, read from the catalogue itself (since 02.10.2026, when the six
      # company plugins joined the six personal ones): a plugin added to the catalogue is tested here the
      # same day, with no list to keep in step by hand.
      - name: Check out every plugin the catalogue lists
        shell: bash
        run: |
          mkdir -p local/.claude-plugin
          names=$(python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(open(sys.argv[1]))["plugins"]))' catalogue/.claude-plugin/marketplace.json 2>/dev/null \
            || python -c 'import json,sys; print(" ".join(p["name"] for p in json.load(open(sys.argv[1]))["plugins"]))' catalogue/.claude-plugin/marketplace.json)
          echo "$names" > local/names.txt
          for p in $names; do
            git clone --quiet --depth 1 --branch "$REF" "https://github.com/vadimchernets/$p" "local/$p"
            rm -rf "local/$p/.git"
            echo "$p $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "local/$p/.claude-plugin/plugin.json" 2>/dev/null || python -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "local/$p/.claude-plugin/plugin.json")"
          done
          entries=""
          for p in $names; do entries="$entries${entries:+, }{\"name\": \"$p\", \"source\": \"./$p\"}"; done
          printf '{"name": "ci-local", "owner": {"name": "ci"}, "plugins": [%s]}\n' "$entries" > local/.claude-plugin/marketplace.json
          cat local/.claude-plugin/marketplace.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Since 02.10.2026 the launcher on Windows also finds a Python that is not on PATH (installed after Claude
      # Code started: the py launcher, %LOCALAPPDATA%\Programs\Python, the registry). The runner image has such
      # Pythons, so "with no Python" would still find one: here the only Python left is setup-python's, on PATH.
      # The job `just-installed-python` checks the places PATH does not know.
      - name: Leave PATH the only place a Python is found (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($k in 'HKCU:\Software\Python', 'HKLM:\Software\Python', 'HKLM:\Software\WOW6432Node\Python') {
            Remove-Item -LiteralPath $k -Recurse -Force -ErrorAction SilentlyContinue
          }
          foreach ($f in "$env:SystemRoot\py.exe", "$env:SystemRoot\pyw.exe", "$env:LOCALAPPDATA\Programs\Python") {
            Remove-Item -LiteralPath $f -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem $env:ProgramFiles -Directory -Filter 'Python3*' -ErrorAction SilentlyContinue |
            ForEach-Object { Rename-Item -LiteralPath $_.FullName "$($_.Name)-moved-away" }
          python -c "import sys; print('the Python on PATH:', sys.executable)"

      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Claude Code (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add the catalogue and install every plugin it lists
        shell: bash
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          claude --version
          claude plugin marketplace add "$GITHUB_WORKSPACE/local"
          for p in $(cat "$GITHUB_WORKSPACE/local/names.txt"); do
            claude plugin install "$p@ci-local"
          done
          claude plugin list

      - name: Every hook, the way Claude Code spawns it
        shell: bash
        run: |
          python catalogue/ci/hooks_like_claude.py --installed "$RUNNER_TEMP/claude-config/plugins/installed_plugins.json"

      - name: A real session fires the hooks (default shell - Git Bash on Windows)
        shell: bash
        run: |
          python catalogue/ci/claude_e2e.py --config "$RUNNER_TEMP/claude-config"

      - name: Every skill's script, the way Claude Code's shell tools run it
        shell: bash
        run: |
          python catalogue/ci/skills_like_claude.py --installed "$RUNNER_TEMP/claude-config/plugins/installed_plugins.json"

      - name: A real session runs the scripts written in two skills (default shell - Git Bash on Windows)
        shell: bash
        run: |
          python catalogue/ci/claude_skill_e2e.py --config "$RUNNER_TEMP/claude-config"

      - name: A real session fires the hooks (Windows with no Git Bash - PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          Rename-Item "C:\Program Files\Git" "Git-moved-away"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { throw "git is still on PATH" }
          if (Test-Path "C:\Program Files\Git\bin\bash.exe") { throw "Git Bash is still there" }
          & $py catalogue/ci/claude_e2e.py --config "$env:RUNNER_TEMP/claude-config"
          $code = $LASTEXITCODE
          & $py catalogue/ci/claude_skill_e2e.py --config "$env:RUNNER_TEMP/claude-config"
          if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
          Rename-Item "C:\Program Files\Git-moved-away" "Git"
          exit $code

  just-installed-python:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: Check out the six plugins
        shell: bash
        run: |
          for p in safecall duocall nightcall mailcall chasecall pocketcall; do
            git clone --quiet --depth 1 --branch "$REF" "https://github.com/vadimchernets/$p" "local/$p"
          done

      - name: Install Python in the same shell, then run a hook and a skill's script with the old PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\local\safecall"
          $probe = "$env:RUNNER_TEMP\which.py"
          "import sys; print('python is', sys.executable, sys.version.split()[0])" | Set-Content -Encoding ascii $probe
          # A Windows that has never had Python: the runner image's Pythons go - off PATH, out of the registry,
          # off the disk - and with them the launcher.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '(?i)python' }) -join ';'
          foreach ($k in 'HKCU:\Software\Python', 'HKLM:\Software\Python', 'HKLM:\Software\WOW6432Node\Python') {
            Remove-Item -LiteralPath $k -Recurse -Force -ErrorAction SilentlyContinue
          }
          foreach ($d in @(Get-ChildItem C:\hostedtoolcache\windows -Directory -Filter 'Python*' -ErrorAction SilentlyContinue) +
                         @(Get-ChildItem $env:ProgramFiles -Directory -Filter 'Python3*' -ErrorAction SilentlyContinue)) {
            Rename-Item -LiteralPath $d.FullName "$($d.Name)-moved-away"
          }
          foreach ($f in "$env:SystemRoot\py.exe", "$env:SystemRoot\pyw.exe", "$env:LOCALAPPDATA\Programs\Python") {
            Remove-Item -LiteralPath $f -Recurse -Force -ErrorAction SilentlyContinue
          }
          function Run-Both([string]$what) {   # the hook's PowerShell line, and a skill's script, as Claude Code runs them
            $hook = (Get-Content -Raw "$root\hooks\hooks.json" | ConvertFrom-Json).hooks.SessionStart[0].hooks[0].command
            $line = ($hook -split "`n")[1].Replace('${CLAUDE_PLUGIN_ROOT}', '${env:CLAUDE_PLUGIN_ROOT}')
            $env:CLAUDE_PLUGIN_ROOT = $root
            $out = @{}
            $out.hook7 = (& pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $line | Out-String).Trim()
            $out.hook51 = (& powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $line | Out-String).Trim()
            $out.skill = (& pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& `"$root/hooks/python.ps1`" safecall say scripts/state.py --help" | Out-String).Trim()
            $out.probe = (& pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& `"$root/hooks/python.ps1`" safecall say `"$probe`"" | Out-String).Trim()
            $unix = $root -replace '\\', '/'
            $out.gitbash = (& "C:\Program Files\Git\bin\bash.exe" -c "exec sh `"$unix/hooks/python.sh`" safecall say `"$unix/scripts/which.py`"" | Out-String).Trim()
            foreach ($k in 'hook7', 'hook51', 'skill', 'probe', 'gitbash') { Write-Host "$what $k : $($out[$k])" }
            return $out
          }
          Copy-Item $probe "$root\scripts\which.py"
          $pathBefore = $env:PATH
          $before = Run-Both 'before'
          foreach ($k in $before.Keys) {
            if ($before[$k] -notmatch 'is paused') { throw "before the install, $k should say safecall is paused: $($before[$k])" }
          }
          # Step 0 of START-HERE for a Windows without winget (this image has none): python.org's installer, no windows.
          curl.exe -fsSL -o "$env:TEMP\py.exe" https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe
          Start-Process -Wait "$env:TEMP\py.exe" "/quiet InstallAllUsers=0 PrependPath=1"
          if ($env:PATH -ne $pathBefore) { throw "the PATH of this shell changed" }
          if (Get-Command python -CommandType Application -ErrorAction SilentlyContinue | Where-Object { $_.Source -notmatch 'WindowsApps' }) {
            throw "a real python is on the old PATH - the test would prove nothing"
          }
          Write-Host "user PATH now: $([Environment]::GetEnvironmentVariable('Path', 'User'))"
          $after = Run-Both 'after'
          foreach ($k in $after.Keys) {
            if ($after[$k] -match 'is paused' -or -not $after[$k]) { throw "after the install, $k did not run: $($after[$k])" }
          }
          if ($after.skill -notmatch '(?i)usage') { throw "the skill's script did not print its usage: $($after.skill)" }
          foreach ($k in 'probe', 'gitbash') {
            if ($after[$k] -notmatch 'python is .*3\.12\.10') { throw "$k did not use the Python just installed: $($after[$k])" }
          }
          Write-Host "PASS: a Python installed in this shell is found by the hook (PowerShell 7, 5.1), a skill's script and Git Bash - PATH unchanged, no restart"
